        /* Base style for parsed phrase chips */

            display: inline-block;
            padding: 2px 6px;
            margin: 2px 1px;
            border-radius: 6px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
            border-bottom: 2px transparent solid;
            line-height: 1.8rem;
        }

        .speaker-tag {
            font-weight: 700 !important;
            color: #1e293b !important;
            background-color: #e2e8f0 !important;
        }

        .time-tag {
            color: #64748b !important;
            font-size: 0.9em;
            margin-right: 6px;
        }

        }

        .phrase-np:hover, .phrase-np.active-filter {
            background-color: #dbeafe !important;
            color: #1e40af;
            border-bottom-color: #3b82f6;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.15);
        }

        .phrase-pp:hover, .phrase-pp.active-filter {
            background-color: #dcfce7 !important;
            color: #166534;
            border-bottom-color: #22c55e;
            box-shadow: 0 2px 8px rgba(34, 197, 94, 0.15);

            background-color: #fef3c7 !important;
            color: #92400e;
            border-bottom-color: #eab308;
            box-shadow: 0 2px 8px rgba(234, 179, 8, 0.15);
        }

        .phrase-other:hover, .phrase-other.active-filter {
            background-color: #f3e8ff !important;
            color: #6b21a8;
            border-bottom-color: #a855f7;
            box-shadow: 0 2px 8px rgba(168, 85, 247, 0.15);
        }

        /* Hover Tooltip design */
        .phrase-tag .tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);

  { text: "Questions 149-151", type: "np", grammarName: "Cụm danh từ", viTranslation: "Câu hỏi 149-151", breakLine: true },
  { text: "refer to", type: "vp", grammarName: "Cụm động từ", viTranslation: "tham khảo" },
  { text: "the following article.", type: "np", grammarName: "Cụm danh từ", viTranslation: "bài báo sau đây" },
  { text: "WINNIPEG (10 May)—", type: "np", grammarName: "Cụm danh từ", viTranslation: "WINNIPEG (ngày 10 tháng 5)—", breakLine: true },
  { text: "Manitoba-based (ở - ) satellite (vệ tinh) manufacturer Alita Technology", type: "np", grammarName: "Cụm danh từ", viTranslation: "Nhà sản xuất vệ tinh Alita Technology có trụ sở ở Manitoba" },
  { text: "has been awarded (trao giải)", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã được trao" },
  { text: "a $9 million grant (tài trợ)", type: "np", grammarName: "Cụm danh từ", viTranslation: "khoản tài trợ 9 triệu đô la" },
  { text: "to develop (ptrien)", type: "vp", grammarName: "Cụm động từ", viTranslation: "để phát triển" },
  { text: "an airborne (trên không) sensing (cảm biến) instrument", type: "np", grammarName: "Cụm danh từ", viTranslation: "một thiết bị cảm biến trên không" },
  { text: "to be used", type: "vp", grammarName: "Cụm động từ", viTranslation: "được dùng" },
  { text: "in the collection of climate (thời tiết) data.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "để thu thập dữ liệu khí hậu." },
  { text: "The device", type: "np", grammarName: "Cụm danh từ", viTranslation: "Thiết bị này", breakLine: true },
  { text: "will be engineered to calculate (tính)", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ được chế tạo để tính" },
  { text: "the density (tỉ trọng) and depth of snowpack (lớp tuyết)", type: "np", grammarName: "Cụm danh từ", viTranslation: "tỉ trọng và độ dày của lớp tuyết" },
  { text: "throughout Canada.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trên khắp Canada." },
  { text: "Alita Technology", type: "np", grammarName: "Cụm danh từ", viTranslation: "Alita Technology", breakLine: true },
  { text: "is collaborating (hợp tác)", type: "vp", grammarName: "Cụm động từ", viTranslation: "đang hợp tác" },
  { text: "with the Microwave Engineering Lab at the University of Southam", type: "pp", grammarName: "Cụm giới từ", viTranslation: "với Phòng thí nghiệm Kỹ thuật Vi sóng tại Đại học Southam" },
  { text: "on the initiative (sáng kiến).", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trong sáng kiến này." },
  { text: "Dr. Hugh Jaris, director of the lab's Remote Sensing Unit,", type: "np", grammarName: "Cụm danh từ", viTranslation: "Tiến sĩ Hugh Jaris, giám đốc Đơn vị Viễn thám của phòng thí nghiệm,", breakLine: true },
  { text: "will lead", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ dẫn dắt" },
  { text: "the effort", type: "np", grammarName: "Cụm danh từ", viTranslation: "nỗ lực" },
  { text: "to test", type: "vp", grammarName: "Cụm động từ", viTranslation: "để thử nghiệm" },
  { text: "one or more prototypes (nguyên mẫu)", type: "np", grammarName: "Cụm danh từ", viTranslation: "một hoặc nhiều nguyên mẫu" },
  { text: "by collecting (thu thập) and analysing data next winter.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "bằng cách thu thập và phân tích dữ liệu vào mùa đông tới." },
  { text: "Snowpack data", type: "np", grammarName: "Cụm danh từ", viTranslation: "Dữ liệu lớp tuyết", breakLine: true },
  { text: "is used", type: "vp", grammarName: "Cụm động từ", viTranslation: "được dùng" },
  { text: "to measure (đo lường)", type: "vp", grammarName: "Cụm động từ", viTranslation: "để đo" },
  { text: "year-to-year (năm này qua năm khác) snow trends and fluctuations (biến động)", type: "np", grammarName: "Cụm danh từ", viTranslation: "xu hướng và biến động tuyết theo từng năm" },
  { text: "as well as (và)", type: "other", grammarName: "Liên từ", viTranslation: "cũng như" },
  { text: "to help determine (xác định)", type: "vp", grammarName: "Cụm động từ", viTranslation: "để giúp xác định" },
  { text: "how much water from snowmelt", type: "np", grammarName: "Cụm danh từ", viTranslation: "lượng nước từ tuyết tan" },
  { text: "will be available", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ có sẵn" },
  { text: "in key areas of the country (đất nước).", type: "pp", grammarName: "Cụm giới từ", viTranslation: "ở các khu vực trọng điểm của đất nước." },
  { text: "Questions 152-153", type: "np", grammarName: "Cụm danh từ", viTranslation: "Câu hỏi 152-153", breakLine: true },
  { text: "refer to", type: "vp", grammarName: "Cụm động từ", viTranslation: "tham khảo" },
  { text: "the following receipt (biên lai).", type: "np", grammarName: "Cụm danh từ", viTranslation: "biên lai sau đây" },
  { text: "Stub Master—Your Ticket Source for Concerts, Sports, and Theater (nhà hát)", type: "np", grammarName: "Cụm danh từ", viTranslation: "Stub Master—Nguồn vé của bạn cho hòa nhạc, thể thao và nhà hát", breakLine: true },
  { text: "Hello, Mr. Sato,", type: "other", grammarName: "Thành phần khác", viTranslation: "Xin chào ông Sato,", breakLine: true },
  { text: "Thanks", type: "vp", grammarName: "Cụm động từ", viTranslation: "Cảm ơn", breakLine: true },
  { text: "for your purchase!", type: "pp", grammarName: "Cụm giới từ", viTranslation: "vì đã mua hàng!" },
  { text: "Your mobile (di động) ticket (vé)", type: "np", grammarName: "Cụm danh từ", viTranslation: "Vé di động của ông", breakLine: true },
  { text: "is", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã" },
  { text: "ready", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "sẵn sàng" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "available", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "có sẵn" },
  { text: "in the Stub Master account you created (tạo) online.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trong tài khoản Stub Master mà ông đã tạo trực tuyến." },
  { text: "All Stub Master tickets", type: "np", grammarName: "Cụm danh từ", viTranslation: "Mọi vé Stub Master", breakLine: true },
  { text: "contain (bao gồm)", type: "vp", grammarName: "Cụm động từ", viTranslation: "có" },
  { text: "a unique (độc nhất) barcode (mã vạch)", type: "np", grammarName: "Cụm danh từ", viTranslation: "một mã vạch duy nhất" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "may not be printed, copied, or shared.", type: "vp", grammarName: "Cụm động từ", viTranslation: "không được in, sao chép hay chia sẻ." },
  { text: "Please use", type: "vp", grammarName: "Cụm động từ", viTranslation: "Vui lòng dùng", breakLine: true },
  { text: "the Stub Master app on your phone", type: "np", grammarName: "Cụm danh từ", viTranslation: "ứng dụng Stub Master trên điện thoại" },
  { text: "to access (truy cập)", type: "vp", grammarName: "Cụm động từ", viTranslation: "để truy cập" },
  { text: "your ticket", type: "np", grammarName: "Cụm danh từ", viTranslation: "vé của ông" },
  { text: "so that", type: "other", grammarName: "Liên từ", viTranslation: "để" },
  { text: "it", type: "np", grammarName: "Đại từ", viTranslation: "vé" },
  { text: "can be scanned (quét)", type: "vp", grammarName: "Cụm động từ", viTranslation: "có thể được quét" },
  { text: "electronically", type: "adjp", grammarName: "Trạng từ", viTranslation: "điện tử" },
  { text: "for entry (vào) to the event.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "để vào sự kiện." },
  { text: "Questions 154-156", type: "np", grammarName: "Cụm danh từ", viTranslation: "Câu hỏi 154-156", breakLine: true },
  { text: "refer to", type: "vp", grammarName: "Cụm động từ", viTranslation: "tham khảo" },
  { text: "the following press release.", type: "np", grammarName: "Cụm danh từ", viTranslation: "thông cáo báo chí sau đây" },
  { text: "FOR IMMEDIATE RELEASE", type: "np", grammarName: "Cụm danh từ", viTranslation: "CÔNG BỐ NGAY LẬP TỨC", breakLine: true },
  { text: "Contact: Nadia Khumalo, nadia_khumalo@gulfbrookcreations.co.za", type: "np", grammarName: "Cụm danh từ", viTranslation: "Liên hệ: Nadia Khumalo, nadia_khumalo@gulfbrookcreations.co.za", breakLine: true },
  { text: "CAPE TOWN (20 August)—", type: "np", grammarName: "Cụm danh từ", viTranslation: "CAPE TOWN (ngày 20 tháng 8)—", breakLine: true },
  { text: "Gulfbrook Creations", type: "np", grammarName: "Cụm danh từ", viTranslation: "Gulfbrook Creations" },
  { text: "today", type: "adjp", grammarName: "Trạng từ", viTranslation: "hôm nay" },
  { text: "announced", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã thông báo" },
  { text: "the appointment (sự bổ nhiệm) of Ms. Candace Masondo", type: "np", grammarName: "Cụm danh từ", viTranslation: "việc bổ nhiệm bà Candace Masondo" },
  { text: "as the company's chief design officer (CDO),", type: "pp", grammarName: "Cụm giới từ", viTranslation: "làm giám đốc thiết kế (CDO) của công ty," },
  { text: "effective (hiệu lực) 1 September.", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "có hiệu lực từ ngày 1 tháng 9." },
  { text: "— [1] —.", type: "other", grammarName: "Thành phần khác", viTranslation: "[1]", breakLine: true },
  { text: "Most recently,", type: "adjp", grammarName: "Trạng từ", viTranslation: "Gần đây nhất,", breakLine: true },
  { text: "Ms. Masondo", type: "np", grammarName: "Cụm danh từ", viTranslation: "bà Masondo" },
  { text: "headed", type: "vp", grammarName: "Cụm động từ", viTranslation: "đứng đầu" },
  { text: "the materials development division", type: "np", grammarName: "Cụm danh từ", viTranslation: "bộ phận phát triển vật liệu" },
  { text: "at Deavora Dynamix, based in Durban.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại Deavora Dynamix, có trụ sở ở Durban." },
  { text: "— [2] —.", type: "other", grammarName: "Thành phần khác", viTranslation: "[2]", breakLine: true },
  { text: "She", type: "np", grammarName: "Đại từ", viTranslation: "Bà", breakLine: true },
  { text: "was", type: "vp", grammarName: "Cụm động từ", viTranslation: "là" },
  { text: "the driving force (động lực)", type: "np", grammarName: "Cụm danh từ", viTranslation: "động lực" },
  { text: "behind that company's mission (sứ mệnh)", type: "pp", grammarName: "Cụm giới từ", viTranslation: "đằng sau sứ mệnh của công ty đó" },
  { text: "to develop", type: "vp", grammarName: "Cụm động từ", viTranslation: "phát triển" },
  { text: "accessibility (có khả năng tiếp cận) products", type: "np", grammarName: "Cụm danh từ", viTranslation: "các sản phẩm dễ tiếp cận" },
  { text: "to enhance (nâng cao)", type: "vp", grammarName: "Cụm động từ", viTranslation: "nhằm nâng cao" },
  { text: "independent (độc lập) living", type: "np", grammarName: "Cụm danh từ", viTranslation: "cuộc sống độc lập" },
  { text: "in South Africa's domestic (nội địa) market.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại thị trường nội địa Nam Phi." },
  { text: "Mr. Jonathan Ngobeni, Gulfbrook's president,", type: "np", grammarName: "Cụm danh từ", viTranslation: "Ông Jonathan Ngobeni, chủ tịch Gulfbrook,", breakLine: true },
  { text: "acknowledges (thừa nhận)", type: "vp", grammarName: "Cụm động từ", viTranslation: "ghi nhận" },
  { text: "Ms. Masondo's skills and resourcefulness (sự tháo vát).", type: "np", grammarName: "Cụm danh từ", viTranslation: "kỹ năng và sự tháo vát của bà Masondo." },
  { text: "\"In her three-decades-long design career (sự nghiệp),", type: "pp", grammarName: "Cụm giới từ", viTranslation: "\"Trong sự nghiệp thiết kế kéo dài ba thập kỷ,", breakLine: true },
  { text: "Ms. Masondo", type: "np", grammarName: "Cụm danh từ", viTranslation: "bà Masondo" },
  { text: "has designed", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã thiết kế" },
  { text: "numerous (nhiều) products", type: "np", grammarName: "Cụm danh từ", viTranslation: "nhiều sản phẩm" },
  { text: "that", type: "np", grammarName: "Đại từ", viTranslation: "mà" },
  { text: "reflect (phản ánh)", type: "vp", grammarName: "Cụm động từ", viTranslation: "phản ánh" },
  { text: "inclusiveness (tính toàn diện) and self-sufficiency (tự cung tự cấp).", type: "np", grammarName: "Cụm danh từ", viTranslation: "tính toàn diện và khả năng tự lập." },
  { text: "Throughout those years,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Suốt những năm đó,", breakLine: true },
  { text: "she", type: "np", grammarName: "Đại từ", viTranslation: "bà" },
  { text: "has emphasized and demonstrated (chứng minh)", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã nhấn mạnh và chứng minh" },
  { text: "the importance of collaboration", type: "np", grammarName: "Cụm danh từ", viTranslation: "tầm quan trọng của sự hợp tác" },
  { text: "between engineers, designers, and consumers (người tiêu dùng).", type: "pp", grammarName: "Cụm giới từ", viTranslation: "giữa kỹ sư, nhà thiết kế và người tiêu dùng." },
  { text: "She", type: "np", grammarName: "Đại từ", viTranslation: "Bà", breakLine: true },
  { text: "has won", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã giành" },
  { text: "several prestigious (danh giá) awards", type: "np", grammarName: "Cụm danh từ", viTranslation: "nhiều giải thưởng danh giá" },
  { text: "for her work.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cho công việc của mình." },
  { text: "Her achievements (thành tựu)", type: "np", grammarName: "Cụm danh từ", viTranslation: "Những thành tựu của bà", breakLine: true },
  { text: "demonstrate", type: "vp", grammarName: "Cụm động từ", viTranslation: "thể hiện" },
  { text: "her commitment (cam kết)", type: "np", grammarName: "Cụm danh từ", viTranslation: "cam kết của bà" },
  { text: "to colleagues (đồng nghiệp) and product users.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "với đồng nghiệp và người dùng sản phẩm." },
  { text: "We", type: "np", grammarName: "Đại từ", viTranslation: "Chúng tôi", breakLine: true },
  { text: "are excited", type: "vp", grammarName: "Cụm động từ", viTranslation: "rất hào hứng" },
  { text: "that", type: "other", grammarName: "Liên từ", viTranslation: "vì" },
  { text: "she", type: "np", grammarName: "Đại từ", viTranslation: "bà" },
  { text: "will be joining", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ gia nhập" },
  { text: "our team.\"", type: "np", grammarName: "Cụm danh từ", viTranslation: "đội ngũ của chúng tôi.\"" },
  { text: "— [3] —.", type: "other", grammarName: "Thành phần khác", viTranslation: "[3]", breakLine: true },
  { text: "\"It", type: "np", grammarName: "Cụm danh từ", viTranslation: "\"Đây", breakLine: true },
  { text: "is", type: "vp", grammarName: "Cụm động từ", viTranslation: "là" },
  { text: "a tremendous (to lớn) honour (vinh dự) and privilege (đặc quyền)", type: "np", grammarName: "Cụm danh từ", viTranslation: "một vinh dự và đặc quyền to lớn" },
  { text: "to be appointed", type: "vp", grammarName: "Cụm động từ", viTranslation: "được bổ nhiệm" },
  { text: "Gulfbrook's CDO,\"", type: "np", grammarName: "Cụm danh từ", viTranslation: "làm CDO của Gulfbrook,\"" },
  { text: "Ms. Masondo", type: "np", grammarName: "Cụm danh từ", viTranslation: "bà Masondo" },
  { text: "said.", type: "vp", grammarName: "Cụm động từ", viTranslation: "nói." },
  { text: "\"I", type: "np", grammarName: "Đại từ", viTranslation: "\"Tôi", breakLine: true },
  { text: "will do my best", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ cố gắng hết sức" },
  { text: "to advance (nâng cao)", type: "vp", grammarName: "Cụm động từ", viTranslation: "để thúc đẩy" },
  { text: "the company's mission", type: "np", grammarName: "Cụm danh từ", viTranslation: "sứ mệnh của công ty" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "strengthen", type: "vp", grammarName: "Cụm động từ", viTranslation: "củng cố" },
  { text: "its industry presence (sự hiện diện).\"", type: "np", grammarName: "Cụm danh từ", viTranslation: "sự hiện diện của công ty trong ngành.\"" },
  { text: "— [4] —.", type: "other", grammarName: "Thành phần khác", viTranslation: "[4]", breakLine: true },
  { text: "Gulfbrook Creations", type: "np", grammarName: "Cụm danh từ", viTranslation: "Gulfbrook Creations", breakLine: true },
  { text: "is headquartered", type: "vp", grammarName: "Cụm động từ", viTranslation: "có trụ sở chính" },
  { text: "in Johannesburg.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "ở Johannesburg." },
  { text: "For 45 years,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Suốt 45 năm,", breakLine: true },
  { text: "the company", type: "np", grammarName: "Cụm danh từ", viTranslation: "công ty" },
  { text: "has been manufacturing", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã sản xuất" },
  { text: "equipment", type: "np", grammarName: "Cụm danh từ", viTranslation: "thiết bị" },
  { text: "that", type: "np", grammarName: "Đại từ", viTranslation: "giúp" },
  { text: "facilitates (tạo điều kiện)", type: "vp", grammarName: "Cụm động từ", viTranslation: "tạo điều kiện cho" },
  { text: "independent living,", type: "np", grammarName: "Cụm danh từ", viTranslation: "cuộc sống độc lập," },
  { text: "including ergonomic (công thái học) furniture, audio- and visual-enhancement devices (thiết bị), and motorized (cơ giới) mobility (di chuyển) aids (thiết bị hỗ trợ).", type: "pp", grammarName: "Cụm giới từ", viTranslation: "bao gồm đồ nội thất công thái học, thiết bị hỗ trợ âm thanh và hình ảnh và dụng cụ hỗ trợ di chuyển có động cơ." },
  { text: "Its products", type: "np", grammarName: "Cụm danh từ", viTranslation: "Sản phẩm của công ty", breakLine: true },
  { text: "are marketed", type: "vp", grammarName: "Cụm động từ", viTranslation: "được tiếp thị" },
  { text: "mainly (chủ yếu)", type: "adjp", grammarName: "Trạng từ", viTranslation: "chủ yếu" },
  { text: "in Africa.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "ở châu Phi." },
  { text: "Questions 159-161", type: "np", grammarName: "Cụm danh từ", viTranslation: "Câu hỏi 159-161", breakLine: true },
  { text: "refer to", type: "vp", grammarName: "Cụm động từ", viTranslation: "tham khảo" },
  { text: "the following Web page.", type: "np", grammarName: "Cụm danh từ", viTranslation: "trang web sau đây" },
  { text: "https://www.morrisville.gov.za/cityplanning/buildingpermits.", type: "np", grammarName: "Cụm danh từ", viTranslation: "https://www.morrisville.gov.za/cityplanning/buildingpermits.", breakLine: true },
  { text: "Requesting a Building Permit (giấy phép xdung)", type: "np", grammarName: "Cụm danh từ", viTranslation: "Xin giấy phép xây dựng", breakLine: true },
  { text: "A city-issued (được thành phố cấp) building permit", type: "np", grammarName: "Cụm danh từ", viTranslation: "Giấy phép xây dựng do thành phố cấp", breakLine: true },
  { text: "may be required", type: "vp", grammarName: "Cụm động từ", viTranslation: "có thể được yêu cầu" },
  { text: "before initiating (bắt đầu) construction work", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trước khi bắt đầu thi công" },
  { text: "within Morrisville city limits.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trong phạm vi thành phố Morrisville." },
  { text: "No city permit", type: "np", grammarName: "Cụm danh từ", viTranslation: "Không giấy phép thành phố nào", breakLine: true },
  { text: "is required", type: "vp", grammarName: "Cụm động từ", viTranslation: "được yêu cầu" },
  { text: "for work on a building's interior (bên trong) systems,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cho công việc trên hệ thống bên trong tòa nhà," },
  { text: "such as plumbing (ống nước), electrical, or heating and cooling.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "như ống nước, điện, hoặc sưởi và làm mát." },
  { text: "A permit", type: "np", grammarName: "Cụm danh từ", viTranslation: "Giấy phép", breakLine: true },
  { text: "will be needed", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ cần" },
  { text: "for adding to or expanding (mở rộng) the size of a building,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "để thêm hoặc mở rộng quy mô tòa nhà," },
  { text: "for changing the exterior appearance (diện mạo) of a building,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "để thay đổi diện mạo bên ngoài của tòa nhà," },
  { text: "or", type: "other", grammarName: "Liên từ", viTranslation: "hoặc" },
  { text: "for any brand-new (mới tinh) construction project.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cho bất kỳ dự án xây dựng mới tinh nào." },
  { text: "Below (sau đây)", type: "np", grammarName: "Cụm danh từ", viTranslation: "Sau đây", breakLine: true },
  { text: "are", type: "vp", grammarName: "Cụm động từ", viTranslation: "là" },
  { text: "the steps", type: "np", grammarName: "Cụm danh từ", viTranslation: "các bước" },
  { text: "for obtaining (đạt được) a permit and for ensuring full compliance with (tuân thủ) city policies.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "để xin giấy phép và đảm bảo tuân thủ đầy đủ chính sách của thành phố." },
  { text: "1. Check", type: "vp", grammarName: "Cụm động từ", viTranslation: "1. Kiểm tra", breakLine: true },
  { text: "that", type: "other", grammarName: "Liên từ", viTranslation: "rằng" },
  { text: "the building", type: "np", grammarName: "Cụm danh từ", viTranslation: "tòa nhà" },
  { text: "is appropriately (phù hợp) registered.", type: "vp", grammarName: "Cụm động từ", viTranslation: "được đăng ký phù hợp." },
  { text: "See", type: "vp", grammarName: "Cụm động từ", viTranslation: "Xem", breakLine: true },
  { text: "the Registration and Land Use page", type: "np", grammarName: "Cụm danh từ", viTranslation: "trang Đăng ký và Sử dụng đất" },
  { text: "for more information.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "để biết thêm thông tin." },

  { text: "is now open.", type: "vp", grammarName: "Cụm động từ", viTranslation: "nay đã mở cửa." },
  { text: "This unique venue", type: "np", grammarName: "Cụm danh từ", viTranslation: "Địa điểm độc đáo này", breakLine: true },
  { text: "is", type: "vp", grammarName: "Cụm động từ", viTranslation: "là" },
  { text: "a secluded (hẻo lánh) haven", type: "np", grammarName: "Cụm danh từ", viTranslation: "một nơi ẩn dật yên tĩnh" },
  { text: "only minutes away from the city centre.", type: "adjp", grammarName: "Trạng từ", viTranslation: "chỉ cách trung tâm thành phố vài phút." },
  { text: "Its glass walls", type: "np", grammarName: "Cụm danh từ", viTranslation: "Những bức tường kính của nơi này", breakLine: true },
  { text: "give", type: "vp", grammarName: "Cụm động từ", viTranslation: "mang lại" },
  { text: "guests", type: "np", grammarName: "Cụm danh từ", viTranslation: "cho khách" },
  { text: "an enchanted (mê hoặc) view of green gardens and bright (rực rỡ) flowers,", type: "np", grammarName: "Cụm danh từ", viTranslation: "khung cảnh mê hoặc của những khu vườn xanh và hoa rực rỡ," },
  { text: "while", type: "other", grammarName: "Liên từ", viTranslation: "trong khi" },
  { text: "multiple windows in the ceiling (trần)", type: "np", grammarName: "Cụm danh từ", viTranslation: "nhiều cửa sổ trên trần nhà" },
  { text: "make", type: "vp", grammarName: "Cụm động từ", viTranslation: "biến" },
  { text: "the sky", type: "np", grammarName: "Cụm danh từ", viTranslation: "bầu trời" },
  { text: "part of the interior decoration.", type: "np", grammarName: "Cụm danh từ", viTranslation: "thành một phần của trang trí nội thất." },
  { text: "Hillside House", type: "np", grammarName: "Cụm danh từ", viTranslation: "Hillside House", breakLine: true },
  { text: "is", type: "vp", grammarName: "Cụm động từ", viTranslation: "là" },
  { text: "the perfect setting", type: "np", grammarName: "Cụm danh từ", viTranslation: "bối cảnh hoàn hảo" },
  { text: "for weddings and other social gatherings, as well as corporate events.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cho đám cưới và các buổi họp mặt xã hội khác, cũng như sự kiện doanh nghiệp." },
  { text: "The kitchen", type: "np", grammarName: "Cụm danh từ", viTranslation: "Nhà bếp", breakLine: true },
  { text: "is", type: "vp", grammarName: "Cụm động từ", viTranslation: "đặt" },
  { text: "under the direction of Chef Bashu Malik, a two-time Franklin Heard Foundation winner.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "dưới sự chỉ đạo của đầu bếp Bashu Malik, hai lần đoạt giải Franklin Heard Foundation." },
  { text: "Chef Malik", type: "np", grammarName: "Cụm danh từ", viTranslation: "Đầu bếp Malik", breakLine: true },
  { text: "oversees", type: "vp", grammarName: "Cụm động từ", viTranslation: "giám sát" },
  { text: "Hillside House's menus,", type: "np", grammarName: "Cụm danh từ", viTranslation: "thực đơn của Hillside House," },
  { text: "whether", type: "other", grammarName: "Liên từ", viTranslation: "dù" },
  { text: "the event hosts", type: "np", grammarName: "Cụm danh từ", viTranslation: "chủ sự kiện" },
  { text: "choose", type: "vp", grammarName: "Cụm động từ", viTranslation: "chọn" },
  { text: "eclectic (chiết trung) small plates, a family-style dinner, or a buffet brunch (bữa ăn giữa buổi).", type: "np", grammarName: "Cụm danh từ", viTranslation: "các món nhỏ chiết trung, bữa tối kiểu gia đình hay tiệc buffet brunch." },
  { text: "\"Choosing the right venue", type: "np", grammarName: "Cụm danh từ", viTranslation: "\"Việc chọn đúng địa điểm", breakLine: true },
  { text: "is", type: "vp", grammarName: "Cụm động từ", viTranslation: "là" },
  { text: "the key to success,\"", type: "np", grammarName: "Cụm danh từ", viTranslation: "chìa khóa thành công,\"" },
  { text: "says", type: "vp", grammarName: "Cụm động từ", viTranslation: "nói" },
  { text: "Hillside House Managing Director Russell Isley.", type: "np", grammarName: "Cụm danh từ", viTranslation: "Giám đốc điều hành Hillside House Russell Isley." },
  { text: "\"We", type: "np", grammarName: "Đại từ", viTranslation: "\"Chúng tôi", breakLine: true },
  { text: "offer", type: "vp", grammarName: "Cụm động từ", viTranslation: "cung cấp" },
  { text: "everything—a beautiful setting, an experienced staff, and great food.", type: "np", grammarName: "Cụm danh từ", viTranslation: "mọi thứ—bối cảnh đẹp, đội ngũ giàu kinh nghiệm và món ăn tuyệt vời." },
  { text: "Our events coordinator", type: "np", grammarName: "Cụm danh từ", viTranslation: "Điều phối viên sự kiện của chúng tôi", breakLine: true },
  { text: "will work", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ làm việc" },
  { text: "with you", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cùng bạn" },
  { text: "to make", type: "vp", grammarName: "Cụm động từ", viTranslation: "để biến" },
  { text: "your wedding or corporate function (sự kiện công ty)", type: "np", grammarName: "Cụm danh từ", viTranslation: "đám cưới hoặc sự kiện công ty của bạn" },
  { text: "an occasion to remember.\"", type: "np", grammarName: "Cụm danh từ", viTranslation: "thành một dịp đáng nhớ.\"" },
  { text: "Dear Ms. Colling:", type: "np", grammarName: "Cụm danh từ", viTranslation: "Kính gửi bà Colling:", breakLine: true },
  { text: "Thank", type: "vp", grammarName: "Cụm động từ", viTranslation: "Cảm ơn", breakLine: true },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "bà" },
  { text: "for reaching out to Hillside House about your upcoming product launch!", type: "pp", grammarName: "Cụm giới từ", viTranslation: "vì đã liên hệ Hillside House về buổi ra mắt sản phẩm sắp tới!" },
  { text: "Yes,", type: "other", grammarName: "Thành phần khác", viTranslation: "Vâng,", breakLine: true },
  { text: "16 June", type: "np", grammarName: "Cụm danh từ", viTranslation: "ngày 16 tháng 6" },
  { text: "is", type: "vp", grammarName: "Cụm động từ", viTranslation: "còn" },
  { text: "available;", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "trống;" },
  { text: "your Kitchen Designs corporate celebration", type: "np", grammarName: "Cụm danh từ", viTranslation: "buổi lễ doanh nghiệp Kitchen Designs của bà" },
  { text: "is now", type: "vp", grammarName: "Cụm động từ", viTranslation: "nay đã" },
  { text: "on our schedule.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "nằm trong lịch của chúng tôi." },
  { text: "In preparation for the event,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Để chuẩn bị cho sự kiện,", breakLine: true },
  { text: "please note", type: "vp", grammarName: "Cụm động từ", viTranslation: "xin lưu ý" },
  { text: "that", type: "other", grammarName: "Liên từ", viTranslation: "rằng" },
  { text: "we", type: "np", grammarName: "Đại từ", viTranslation: "chúng tôi" },
  { text: "offer", type: "vp", grammarName: "Cụm động từ", viTranslation: "cung cấp" },
  { text: "several unique (độc đáo) branding (thương hiệu) opportunities.", type: "np", grammarName: "Cụm danh từ", viTranslation: "một số cơ hội xây dựng thương hiệu độc đáo." },
  { text: "For example,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Ví dụ,", breakLine: true },
  { text: "we", type: "np", grammarName: "Đại từ", viTranslation: "chúng tôi" },
  { text: "can display", type: "vp", grammarName: "Cụm động từ", viTranslation: "có thể hiển thị" },
  { text: "your company's logo", type: "np", grammarName: "Cụm danh từ", viTranslation: "logo công ty của bà" },
  { text: "in neon lights", type: "pp", grammarName: "Cụm giới từ", viTranslation: "bằng đèn neon" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "hang up", type: "vp", grammarName: "Cụm động từ", viTranslation: "treo" },
  { text: "banners.", type: "np", grammarName: "Cụm danh từ", viTranslation: "băng rôn." },
  { text: "Chef Malik and his staff", type: "np", grammarName: "Cụm danh từ", viTranslation: "Đầu bếp Malik và nhân viên của ông", breakLine: true },
  { text: "can also", type: "adjp", grammarName: "Trạng từ", viTranslation: "cũng có thể" },
  { text: "work", type: "vp", grammarName: "Cụm động từ", viTranslation: "làm việc" },
  { text: "with you", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cùng bà" },
  { text: "to include", type: "vp", grammarName: "Cụm động từ", viTranslation: "để đưa" },
  { text: "logos", type: "np", grammarName: "Cụm danh từ", viTranslation: "logo" },
  { text: "on food items or a cake.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "lên món ăn hoặc bánh." },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "am attaching", type: "vp", grammarName: "Cụm động từ", viTranslation: "đính kèm" },
  { text: "information about the menu options and pricing.", type: "np", grammarName: "Cụm danh từ", viTranslation: "thông tin về các lựa chọn thực đơn và giá." },
  { text: "We", type: "np", grammarName: "Đại từ", viTranslation: "Chúng tôi", breakLine: true },
  { text: "have", type: "vp", grammarName: "Cụm động từ", viTranslation: "có" },
  { text: "a state-of-the-art (hiện đại) sound system and audiovisual (nghe nhìn) equipment", type: "np", grammarName: "Cụm danh từ", viTranslation: "hệ thống âm thanh hiện đại và thiết bị nghe nhìn" },
  { text: "for speeches (phát biểu) and presentations.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cho các bài phát biểu và thuyết trình." },
  { text: "If", type: "other", grammarName: "Liên từ", viTranslation: "Nếu", breakLine: true },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "bà" },
  { text: "would like", type: "vp", grammarName: "Cụm động từ", viTranslation: "muốn có" },
  { text: "entertainment", type: "np", grammarName: "Cụm danh từ", viTranslation: "chương trình giải trí" },
  { text: "for your event,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cho sự kiện," },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "tôi" },
  { text: "can also supply (cung cấp)", type: "vp", grammarName: "Cụm động từ", viTranslation: "cũng có thể cung cấp" },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "cho bà" },
  { text: "with a list of bands and musicians.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "danh sách các ban nhạc và nhạc sĩ." },
  { text: "Please let me know", type: "vp", grammarName: "Cụm động từ", viTranslation: "Vui lòng cho tôi biết", breakLine: true },
  { text: "if", type: "other", grammarName: "Liên từ", viTranslation: "nếu" },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "bà" },
  { text: "have", type: "vp", grammarName: "Cụm động từ", viTranslation: "có" },
  { text: "any other questions.", type: "np", grammarName: "Cụm danh từ", viTranslation: "câu hỏi nào khác." },
  { text: "We at Hillside House", type: "np", grammarName: "Cụm danh từ", viTranslation: "Chúng tôi ở Hillside House", breakLine: true },
  { text: "look forward to hosting", type: "vp", grammarName: "Cụm động từ", viTranslation: "mong được tổ chức" },
  { text: "your event.", type: "np", grammarName: "Cụm danh từ", viTranslation: "sự kiện của bà." },
  { text: "Sincerely,", type: "other", grammarName: "Thành phần khác", viTranslation: "Trân trọng,", breakLine: true },
  { text: "Reka Taimona, Events Coordinator", type: "np", grammarName: "Cụm danh từ", viTranslation: "Reka Taimona, Điều phối viên Sự kiện", breakLine: true },
  { text: "Hillside House", type: "np", grammarName: "Cụm danh từ", viTranslation: "Hillside House", breakLine: true },
  { text: "Questions 181-185", type: "np", grammarName: "Cụm danh từ", viTranslation: "Câu hỏi 181-185", breakLine: true },
  { text: "refer to", type: "vp", grammarName: "Cụm động từ", viTranslation: "tham khảo" },
  { text: "the following e-mails.", type: "np", grammarName: "Cụm danh từ", viTranslation: "các e-mail sau đây" },
  { text: "Hello,", type: "other", grammarName: "Thành phần khác", viTranslation: "Xin chào,", breakLine: true },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "recently", type: "adjp", grammarName: "Trạng từ", viTranslation: "gần đây" },
  { text: "ordered", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã đặt" },
  { text: "a pair of your Western boots in style Erin, size 40, in the chocolate colour.", type: "np", grammarName: "Cụm danh từ", viTranslation: "một đôi bốt phong cách miền Tây kiểu Erin, cỡ 40, màu sô-cô-la." },
  { text: "The boots", type: "np", grammarName: "Cụm danh từ", viTranslation: "Đôi bốt", breakLine: true },
  { text: "arrived", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã đến" },
  { text: "yesterday,", type: "adjp", grammarName: "Trạng từ", viTranslation: "hôm qua," },
  { text: "but", type: "other", grammarName: "Liên từ", viTranslation: "nhưng" },
  { text: "unfortunately,", type: "adjp", grammarName: "Trạng từ", viTranslation: "không may," },
  { text: "their actual colour", type: "np", grammarName: "Cụm danh từ", viTranslation: "màu thực tế của chúng" },
  { text: "is", type: "vp", grammarName: "Cụm động từ", viTranslation: "khác" },
  { text: "different from the colour pictured on your Web site.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "với màu trong ảnh trên trang web của bạn." },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "had been hoping to wear", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã hy vọng được mang" },
  { text: "the boots", type: "np", grammarName: "Cụm danh từ", viTranslation: "đôi bốt" },
  { text: "to a special event next month,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "đến một sự kiện đặc biệt vào tháng sau," },
  { text: "but", type: "other", grammarName: "Liên từ", viTranslation: "nhưng" },
  { text: "they", type: "np", grammarName: "Đại từ", viTranslation: "chúng" },
  { text: "are", type: "vp", grammarName: "Cụm động từ", viTranslation: "thì" },
  { text: "much darker than expected", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "tối hơn nhiều so với dự kiến" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "do not match", type: "vp", grammarName: "Cụm động từ", viTranslation: "không hợp với" },
  { text: "my planned outfit.", type: "np", grammarName: "Cụm danh từ", viTranslation: "trang phục tôi đã dự định." },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "would like to exchange", type: "vp", grammarName: "Cụm động từ", viTranslation: "muốn đổi" },
  { text: "the boots", type: "np", grammarName: "Cụm danh từ", viTranslation: "đôi bốt" },
  { text: "for another pair of the same style and size but in the terracotta (đất nung) colour.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "lấy một đôi khác cùng kiểu và cỡ nhưng màu đất nung." },
  { text: "Please let me know", type: "vp", grammarName: "Cụm động từ", viTranslation: "Vui lòng cho tôi biết", breakLine: true },
  { text: "how to proceed (tiến hành).", type: "np", grammarName: "Cụm danh từ", viTranslation: "cách tiến hành." },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "have purchased", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã mua" },
  { text: "several pairs of boots", type: "np", grammarName: "Cụm danh từ", viTranslation: "nhiều đôi bốt" },
  { text: "from your company in the past", type: "pp", grammarName: "Cụm giới từ", viTranslation: "từ công ty bạn trước đây" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "have always been pleased", type: "vp", grammarName: "Cụm động từ", viTranslation: "luôn hài lòng" },
  { text: "with their durability (độ bền) and comfort.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "với độ bền và sự thoải mái của chúng." },
  { text: "Bella Meyers", type: "np", grammarName: "Cụm danh từ", viTranslation: "Bella Meyers", breakLine: true },
  { text: "Dear Ms. Meyers,", type: "np", grammarName: "Cụm danh từ", viTranslation: "Kính gửi bà Meyers,", breakLine: true },
  { text: "Thank", type: "vp", grammarName: "Cụm động từ", viTranslation: "Cảm ơn", breakLine: true },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "bà" },
  { text: "for your e-mail.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "vì e-mail của bà." },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "am sorry", type: "vp", grammarName: "Cụm động từ", viTranslation: "rất tiếc" },
  { text: "you", type: "other", grammarName: "Liên từ", viTranslation: "vì bà" },
  { text: "were disappointed", type: "vp", grammarName: "Cụm động từ", viTranslation: "thất vọng" },
  { text: "with your order.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "với đơn hàng." },
  { text: "We", type: "np", grammarName: "Đại từ", viTranslation: "Chúng tôi", breakLine: true },
  { text: "are happy to arrange", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẵn lòng sắp xếp" },
  { text: "an exchange", type: "np", grammarName: "Cụm danh từ", viTranslation: "việc đổi hàng" },
  { text: "as long as (miễn là)", type: "other", grammarName: "Liên từ", viTranslation: "miễn là" },
  { text: "the boots you wish to return", type: "np", grammarName: "Cụm danh từ", viTranslation: "đôi bốt bà muốn trả" },
  { text: "have not been worn (wear).", type: "vp", grammarName: "Cụm động từ", viTranslation: "chưa được mang." },
  { text: "At the moment (hiện tại),", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Hiện tại,", breakLine: true },
  { text: "boots in the size, style, and colour you are requesting", type: "np", grammarName: "Cụm danh từ", viTranslation: "bốt đúng cỡ, kiểu và màu bà yêu cầu" },
  { text: "are", type: "vp", grammarName: "Cụm động từ", viTranslation: "đang" },
  { text: "out of stock (hết hàng).", type: "pp", grammarName: "Cụm giới từ", viTranslation: "hết hàng." },
  { text: "Because", type: "other", grammarName: "Liên từ", viTranslation: "Vì", breakLine: true },
  { text: "we", type: "np", grammarName: "Đại từ", viTranslation: "chúng tôi" },
  { text: "are", type: "vp", grammarName: "Cụm động từ", viTranslation: "là" },
  { text: "a small company,", type: "np", grammarName: "Cụm danh từ", viTranslation: "một công ty nhỏ," },
  { text: "our inventory", type: "np", grammarName: "Cụm danh từ", viTranslation: "hàng tồn kho của chúng tôi" },
  { text: "is not always", type: "vp", grammarName: "Cụm động từ", viTranslation: "không phải lúc nào cũng" },
  { text: "fully available.", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "đầy đủ." },
  { text: "Other than (ngoài) what you have purchased,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Ngoài thứ bà đã mua,", breakLine: true },
  { text: "we", type: "np", grammarName: "Đại từ", viTranslation: "chúng tôi" },
  { text: "currently", type: "adjp", grammarName: "Trạng từ", viTranslation: "hiện" },
  { text: "have", type: "vp", grammarName: "Cụm động từ", viTranslation: "có" },
  { text: "the Erin boots of your size", type: "np", grammarName: "Cụm danh từ", viTranslation: "bốt Erin đúng cỡ của bà" },
  { text: "in the following colours: sand and forest.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "ở các màu sau: cát và xanh rừng." },
  { text: "Since", type: "other", grammarName: "Liên từ", viTranslation: "Vì", breakLine: true },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "bà" },
  { text: "are interested in", type: "vp", grammarName: "Cụm động từ", viTranslation: "quan tâm đến" },
  { text: "a paler (nhạt hơn) colour,", type: "np", grammarName: "Cụm danh từ", viTranslation: "màu nhạt hơn," },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "tôi" },
  { text: "recommend", type: "vp", grammarName: "Cụm động từ", viTranslation: "đề xuất" },
  { text: "sand.", type: "np", grammarName: "Cụm danh từ", viTranslation: "màu cát." },
  { text: "It", type: "np", grammarName: "Đại từ", viTranslation: "Đó", breakLine: true },
  { text: "is", type: "vp", grammarName: "Cụm động từ", viTranslation: "là" },
  { text: "a warm shade", type: "np", grammarName: "Cụm danh từ", viTranslation: "một sắc ấm" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "very versatile (linh hoạt).", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "rất linh hoạt." },
  { text: "Additionally,", type: "adjp", grammarName: "Trạng từ", viTranslation: "Ngoài ra,", breakLine: true },
  { text: "we", type: "np", grammarName: "Đại từ", viTranslation: "chúng tôi" },
  { text: "have", type: "vp", grammarName: "Cụm động từ", viTranslation: "có" },
  { text: "other styles", type: "np", grammarName: "Cụm danh từ", viTranslation: "các kiểu khác" },
  { text: "available", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "sẵn" },
  { text: "in your preferred colour, including Viola boots, our most popular style.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "ở màu bà ưa thích, gồm bốt Viola, kiểu phổ biến nhất của chúng tôi." },
  { text: "Please let me know", type: "vp", grammarName: "Cụm động từ", viTranslation: "Vui lòng cho tôi biết", breakLine: true },
  { text: "if", type: "other", grammarName: "Liên từ", viTranslation: "nếu" },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "bà" },
  { text: "would like to exchange", type: "vp", grammarName: "Cụm động từ", viTranslation: "muốn đổi" },
  { text: "your boots", type: "np", grammarName: "Cụm danh từ", viTranslation: "đôi bốt của bà" },
  { text: "for any of the above (trên) options.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "lấy bất kỳ lựa chọn nào ở trên." },
  { text: "If so,", type: "other", grammarName: "Liên từ", viTranslation: "Nếu vậy,", breakLine: true },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "tôi" },
  { text: "can send", type: "vp", grammarName: "Cụm động từ", viTranslation: "có thể gửi" },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "cho bà" },
  { text: "a postage-paid return label (nhãn trả hàng đã trả sẵn cước phí)", type: "np", grammarName: "Cụm danh từ", viTranslation: "nhãn trả hàng đã trả sẵn cước phí" },
  { text: "via e-mail", type: "pp", grammarName: "Cụm giới từ", viTranslation: "qua e-mail" },
  { text: "for you to print", type: "vp", grammarName: "Cụm động từ", viTranslation: "để bà in" },
  { text: "at home.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "ở nhà." },
  { text: "Thank", type: "vp", grammarName: "Cụm động từ", viTranslation: "Cảm ơn", breakLine: true },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "bà" },
  { text: "for your business.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "vì đã mua hàng." },
  { text: "If", type: "other", grammarName: "Liên từ", viTranslation: "Nếu", breakLine: true },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "bà" },
  { text: "have not signed up", type: "vp", grammarName: "Cụm động từ", viTranslation: "chưa đăng ký" },
  { text: "for our newsletter (bản tin) yet,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "nhận bản tin của chúng tôi," },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "tôi" },
  { text: "suggest", type: "vp", grammarName: "Cụm động từ", viTranslation: "đề nghị" },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "bà" },
  { text: "do.", type: "vp", grammarName: "Cụm động từ", viTranslation: "nên đăng ký." },
  { text: "We", type: "np", grammarName: "Đại từ", viTranslation: "Chúng tôi", breakLine: true },
  { text: "offer", type: "vp", grammarName: "Cụm động từ", viTranslation: "cung cấp" },
  { text: "discounts", type: "np", grammarName: "Cụm danh từ", viTranslation: "ưu đãi giảm giá" },
  { text: "on discontinued (ngừng sản xuất) styles.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cho các kiểu đã ngừng sản xuất." },
  { text: "Sincerely,", type: "other", grammarName: "Thành phần khác", viTranslation: "Trân trọng,", breakLine: true },
  { text: "Brendan Stephens, Customer Service Representative", type: "np", grammarName: "Cụm danh từ", viTranslation: "Brendan Stephens, Đại diện Dịch vụ Khách hàng", breakLine: true },
  { text: "Takem Boot Company", type: "np", grammarName: "Cụm danh từ", viTranslation: "Công ty Takem Boot", breakLine: true },
  { text: "Questions 186-190", type: "np", grammarName: "Cụm danh từ", viTranslation: "Câu hỏi 186-190", breakLine: true },
  { text: "refer to", type: "vp", grammarName: "Cụm động từ", viTranslation: "tham khảo" },
  { text: "the following e-mail, article, and Web page.", type: "np", grammarName: "Cụm danh từ", viTranslation: "e-mail, bài báo và trang web sau đây" },
  { text: "Dear Ms. Marpone,", type: "np", grammarName: "Cụm danh từ", viTranslation: "Kính gửi bà Marpone,", breakLine: true },
  { text: "My last article about East Core Park", type: "np", grammarName: "Cụm danh từ", viTranslation: "Bài viết gần nhất của tôi về công viên East Core", breakLine: true },
  { text: "attracted", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã thu hút" },
  { text: "quite a few online comments.", type: "np", grammarName: "Cụm danh từ", viTranslation: "khá nhiều bình luận trực tuyến." },
  { text: "The comments", type: "np", grammarName: "Cụm danh từ", viTranslation: "Các bình luận", breakLine: true },
  { text: "were", type: "vp", grammarName: "Cụm động từ", viTranslation: "là" },
  { text: "from residents (cư dân)", type: "pp", grammarName: "Cụm giới từ", viTranslation: "từ cư dân" },
  { text: "complaining about", type: "vp", grammarName: "Cụm động từ", viTranslation: "phàn nàn về" },
  { text: "overgrown (mọc um tùm) weeds (cỏ dại) and fallen branches (cành cây)", type: "np", grammarName: "Cụm danh từ", viTranslation: "cỏ dại mọc um tùm và cành cây gãy" },
  { text: "on the Blue Trail.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trên Đường mòn Xanh." },
  { text: "They", type: "np", grammarName: "Đại từ", viTranslation: "Họ", breakLine: true },
  { text: "say", type: "vp", grammarName: "Cụm động từ", viTranslation: "nói" },
  { text: "that", type: "other", grammarName: "Liên từ", viTranslation: "rằng" },
  { text: "the Red Trail", type: "np", grammarName: "Cụm danh từ", viTranslation: "Đường mòn Đỏ" },
  { text: "is", type: "vp", grammarName: "Cụm động từ", viTranslation: "đang" },
  { text: "in good condition,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trong tình trạng tốt," },
  { text: "but", type: "other", grammarName: "Liên từ", viTranslation: "nhưng" },
  { text: "maintenance issues", type: "np", grammarName: "Cụm danh từ", viTranslation: "các vấn đề bảo trì" },
  { text: "have persisted (tồn tại)", type: "vp", grammarName: "Cụm động từ", viTranslation: "vẫn tồn tại" },
  { text: "on the Blue Trail for quite some time.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trên Đường mòn Xanh khá lâu rồi." },
  { text: "As the newest member of the city council,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Là thành viên mới nhất của hội đồng thành phố,", breakLine: true },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "bà" },
  { text: "might not have heard", type: "vp", grammarName: "Cụm động từ", viTranslation: "có thể chưa nghe" },
  { text: "many complaints", type: "np", grammarName: "Cụm danh từ", viTranslation: "nhiều phàn nàn" },
  { text: "yet.", type: "adjp", grammarName: "Trạng từ", viTranslation: "cho đến nay." },
  { text: "However,", type: "adjp", grammarName: "Trạng từ", viTranslation: "Tuy nhiên,", breakLine: true },
  { text: "if", type: "other", grammarName: "Liên từ", viTranslation: "nếu" },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "bà" },
  { text: "do get", type: "vp", grammarName: "Cụm động từ", viTranslation: "có nhận" },
  { text: "briefings regarding the situation,", type: "np", grammarName: "Cụm danh từ", viTranslation: "các buổi báo cáo về tình hình," },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "tôi" },
  { text: "would be grateful (biết ơn)", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ biết ơn" },
  { text: "for any updates", type: "pp", grammarName: "Cụm giới từ", viTranslation: "vì bất kỳ cập nhật nào" },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "bà" },
  { text: "can pass along (đưa cho).", type: "vp", grammarName: "Cụm động từ", viTranslation: "có thể chuyển cho tôi." },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "reached out", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã liên hệ" },
  { text: "to parks commissioner (ủy viên) Oscar Lunes", type: "pp", grammarName: "Cụm giới từ", viTranslation: "với ủy viên công viên Oscar Lunes" },
  { text: "for comments about this,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "để xin ý kiến về việc này," },
  { text: "but", type: "other", grammarName: "Liên từ", viTranslation: "nhưng" },
  { text: "he", type: "np", grammarName: "Đại từ", viTranslation: "ông ấy" },
  { text: "hasn't responded.", type: "vp", grammarName: "Cụm động từ", viTranslation: "chưa phản hồi." },
  { text: "Someone", type: "np", grammarName: "Cụm danh từ", viTranslation: "Có người", breakLine: true },
  { text: "mentioned", type: "vp", grammarName: "Cụm động từ", viTranslation: "nói" },
  { text: "he", type: "np", grammarName: "Đại từ", viTranslation: "ông ấy" },
  { text: "might be", type: "vp", grammarName: "Cụm động từ", viTranslation: "có thể đang" },
  { text: "busy", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "bận" },
  { text: "preparing for retirement.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "chuẩn bị nghỉ hưu." },
  { text: "Sincerely,", type: "other", grammarName: "Thành phần khác", viTranslation: "Trân trọng,", breakLine: true },
  { text: "Greg Tanner", type: "np", grammarName: "Cụm danh từ", viTranslation: "Greg Tanner", breakLine: true },
  { text: "Hale City News", type: "np", grammarName: "Cụm danh từ", viTranslation: "Hale City News", breakLine: true },
  { text: "City Parks Department (Sở công viên)", type: "np", grammarName: "Cụm danh từ", viTranslation: "Sở Công viên Thành phố", breakLine: true },
  { text: "Launches", type: "vp", grammarName: "Cụm động từ", viTranslation: "khởi động" },
  { text: "Volunteer Initiative", type: "np", grammarName: "Cụm danh từ", viTranslation: "sáng kiến tình nguyện" },
  { text: "By Greg Tanner", type: "np", grammarName: "Cụm danh từ", viTranslation: "Bởi Greg Tanner", breakLine: true },
  { text: "Hale City (July 12)—", type: "np", grammarName: "Cụm danh từ", viTranslation: "Hale City (ngày 12 tháng 7)—", breakLine: true },
  { text: "In response to residents' concerns about conditions on the hiking paths at East Core Park,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Đáp lại mối lo ngại của cư dân về tình trạng các đường đi bộ đường dài ở công viên East Core," },
  { text: "the Hale City Parks Department", type: "np", grammarName: "Cụm danh từ", viTranslation: "Sở Công viên Thành phố Hale" },
  { text: "offers", type: "vp", grammarName: "Cụm động từ", viTranslation: "đưa ra" },
  { text: "an explanation and an outline (phác thảo) of its plans for trail upkeep (bảo trì).", type: "np", grammarName: "Cụm danh từ", viTranslation: "lời giải thích và bản phác thảo kế hoạch bảo trì đường mòn." },
  { text: "\"Trail maintenance", type: "np", grammarName: "Cụm danh từ", viTranslation: "\"Việc bảo trì đường mòn", breakLine: true },
  { text: "is transitioning", type: "vp", grammarName: "Cụm động từ", viTranslation: "đang chuyển" },
  { text: "from being performed by city employees to an all-volunteer model,\"", type: "pp", grammarName: "Cụm giới từ", viTranslation: "từ do nhân viên thành phố thực hiện sang mô hình hoàn toàn tình nguyện,\"" },
  { text: "said", type: "vp", grammarName: "Cụm động từ", viTranslation: "nói" },
  { text: "newly appointed parks commissioner Helen Yancey.", type: "np", grammarName: "Cụm danh từ", viTranslation: "ủy viên công viên mới được bổ nhiệm Helen Yancey." },
  { text: "\"Before my predecessor (tiền nhiệm) stepped down (từ chức) after twenty years of service to the city,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "\"Trước khi người tiền nhiệm của tôi từ chức sau hai mươi năm phục vụ thành phố,", breakLine: true },
  { text: "he", type: "np", grammarName: "Đại từ", viTranslation: "ông ấy" },
  { text: "began", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã bắt đầu" },
  { text: "this shift (sự dịch chuyển).", type: "np", grammarName: "Cụm danh từ", viTranslation: "sự chuyển đổi này." },
  { text: "The result", type: "np", grammarName: "Cụm danh từ", viTranslation: "Kết quả", breakLine: true },
  { text: "was", type: "vp", grammarName: "Cụm động từ", viTranslation: "là" },
  { text: "temporary suspension (đình chỉ) of maintenance on the Blue Trail.\"", type: "np", grammarName: "Cụm danh từ", viTranslation: "việc tạm đình chỉ bảo trì trên Đường mòn Xanh.\"" },
  { text: "Ms. Yancey", type: "np", grammarName: "Cụm danh từ", viTranslation: "Bà Yancey", breakLine: true },
  { text: "added", type: "vp", grammarName: "Cụm động từ", viTranslation: "nói thêm" },
  { text: "that", type: "other", grammarName: "Liên từ", viTranslation: "rằng" },
  { text: "the volunteer model", type: "np", grammarName: "Cụm danh từ", viTranslation: "mô hình tình nguyện" },
  { text: "will save", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ tiết kiệm" },
  { text: "money", type: "np", grammarName: "Cụm danh từ", viTranslation: "tiền" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "allow", type: "vp", grammarName: "Cụm động từ", viTranslation: "cho phép" },
  { text: "residents", type: "np", grammarName: "Cụm danh từ", viTranslation: "cư dân" },
  { text: "greater involvement with the park system.", type: "np", grammarName: "Cụm danh từ", viTranslation: "tham gia nhiều hơn vào hệ thống công viên." },
  { text: "Accordingly (theo đó),", type: "adjp", grammarName: "Trạng từ", viTranslation: "Theo đó,", breakLine: true },
  { text: "the Hale City Parks Department", type: "np", grammarName: "Cụm danh từ", viTranslation: "Sở Công viên Thành phố Hale" },
  { text: "has scheduled", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã lên lịch" },
  { text: "its first volunteer cleanup event, Trail Cleanup Day,", type: "np", grammarName: "Cụm danh từ", viTranslation: "sự kiện dọn dẹp tình nguyện đầu tiên, Ngày Dọn dẹp Đường mòn," },
  { text: "on August 12, from 9:00 A.M. to 2:00 P.M.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "vào ngày 12 tháng 8, từ 9 giờ sáng đến 2 giờ chiều." },
  { text: "Those interested in volunteering", type: "np", grammarName: "Cụm danh từ", viTranslation: "Những ai quan tâm đến việc làm tình nguyện", breakLine: true },
  { text: "may register", type: "vp", grammarName: "Cụm động từ", viTranslation: "có thể đăng ký" },
  { text: "online", type: "adjp", grammarName: "Trạng từ", viTranslation: "trực tuyến" },
  { text: "at www.halecityparks.org/events.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại www.halecityparks.org/events." },
  { text: "Hale City Parks Department", type: "np", grammarName: "Cụm danh từ", viTranslation: "Sở Công viên Thành phố Hale", breakLine: true },
  { text: "August Announcements", type: "np", grammarName: "Cụm danh từ", viTranslation: "Thông báo tháng 8", breakLine: true },
  { text: "The Hale City Parks Department's inaugural (khai mạc) Trail Cleanup Day,", type: "np", grammarName: "Cụm danh từ", viTranslation: "Ngày Dọn dẹp Đường mòn khai mạc của Sở Công viên Thành phố Hale,", breakLine: true },
  { text: "held", type: "vp", grammarName: "Cụm động từ", viTranslation: "được tổ chức" },
  { text: "on August 8,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "vào ngày 8 tháng 8," },
  { text: "was", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã là" },
  { text: "a great success.", type: "np", grammarName: "Cụm danh từ", viTranslation: "một thành công lớn." },
  { text: "An enthusiastic (nhiệt tình) group of volunteers", type: "np", grammarName: "Cụm danh từ", viTranslation: "Một nhóm tình nguyện viên nhiệt tình", breakLine: true },
  { text: "cleared", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã dọn" },
  { text: "debris (mảnh vụn) and weeds", type: "np", grammarName: "Cụm danh từ", viTranslation: "mảnh vụn và cỏ dại" },
  { text: "from the Blue Trail at East Core Park", type: "pp", grammarName: "Cụm giới từ", viTranslation: "khỏi Đường mòn Xanh ở công viên East Core" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "had", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã làm cho" },
  { text: "the path", type: "np", grammarName: "Cụm danh từ", viTranslation: "con đường" },
  { text: "clean and usable (sử dụng được)", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "sạch và sử dụng được" },
  { text: "just before noon on the bright, warm day.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "ngay trước buổi trưa của một ngày nắng ấm." },
  { text: "Special thanks", type: "np", grammarName: "Cụm danh từ", viTranslation: "Lời cảm ơn đặc biệt", breakLine: true },
  { text: "go", type: "vp", grammarName: "Cụm động từ", viTranslation: "xin gửi" },
  { text: "to the following participants.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "đến những người tham gia sau đây." },
  { text: "* Amy Harris,", type: "np", grammarName: "Cụm danh từ", viTranslation: "* Amy Harris,", breakLine: true },
  { text: "for coordinating (phối hợp) volunteer efforts and bringing beverages", type: "pp", grammarName: "Cụm giới từ", viTranslation: "vì đã phối hợp nỗ lực tình nguyện và mang đồ uống" },
  { text: "* Jason Skoda, resident of the adjacent (bên cạnh) East Heights neighborhood,", type: "np", grammarName: "Cụm danh từ", viTranslation: "* Jason Skoda, cư dân khu East Heights bên cạnh,", breakLine: true },
  { text: "for lending his power trimmer (máy cắt tỉa), pruning shears (kéo cắt tỉa), and rakes (cào) to our crew of volunteers", type: "pp", grammarName: "Cụm giới từ", viTranslation: "vì đã cho đội tình nguyện viên mượn máy cắt tỉa, kéo cắt tỉa và cào" },
  { text: "We", type: "np", grammarName: "Đại từ", viTranslation: "Chúng tôi", breakLine: true },
  { text: "encourage", type: "vp", grammarName: "Cụm động từ", viTranslation: "khuyến khích" },
  { text: "residents", type: "np", grammarName: "Cụm danh từ", viTranslation: "cư dân" },
  { text: "to visit", type: "vp", grammarName: "Cụm động từ", viTranslation: "truy cập" },
  { text: "this page", type: "np", grammarName: "Cụm danh từ", viTranslation: "trang này" },
  { text: "often", type: "adjp", grammarName: "Trạng từ", viTranslation: "thường xuyên" },
  { text: "to learn", type: "vp", grammarName: "Cụm động từ", viTranslation: "để biết" },
  { text: "about upcoming volunteer events.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "về các sự kiện tình nguyện sắp tới." },
  { text: "Questions 191-195", type: "np", grammarName: "Cụm danh từ", viTranslation: "Câu hỏi 191-195", breakLine: true },
  { text: "refer to", type: "vp", grammarName: "Cụm động từ", viTranslation: "tham khảo" },
  { text: "the following e-mails and chart.", type: "np", grammarName: "Cụm danh từ", viTranslation: "các e-mail và biểu đồ sau đây" },
  { text: "E-Mail Message", type: "np", grammarName: "Cụm danh từ", viTranslation: "Thư điện tử", breakLine: true },
  { text: "To: All Staff", type: "np", grammarName: "Cụm danh từ", viTranslation: "Gửi tới: Toàn thể nhân viên", breakLine: true },
  { text: "From: Miranda Noonan", type: "np", grammarName: "Cụm danh từ", viTranslation: "Từ: Miranda Noonan", breakLine: true },
  { text: "Date: June 26", type: "np", grammarName: "Cụm danh từ", viTranslation: "Ngày: 26 tháng 6", breakLine: true },
  { text: "Subject: Art auction (đấu giá)", type: "np", grammarName: "Cụm danh từ", viTranslation: "Chủ đề: Đấu giá nghệ thuật", breakLine: true },
  { text: "Attachment: Donations", type: "np", grammarName: "Cụm danh từ", viTranslation: "Đính kèm: Donations", breakLine: true },
  { text: "Dear Employees,", type: "np", grammarName: "Cụm danh từ", viTranslation: "Các nhân viên thân mến,", breakLine: true },
  { text: "Ogunsanya and Bolden Law Firm", type: "np", grammarName: "Cụm danh từ", viTranslation: "Công ty luật Ogunsanya and Bolden", breakLine: true },
  { text: "is hosting", type: "vp", grammarName: "Cụm động từ", viTranslation: "đang tổ chức" },
  { text: "our annual art auction,", type: "np", grammarName: "Cụm danh từ", viTranslation: "buổi đấu giá nghệ thuật hằng năm của chúng ta," },
  { text: "with all proceeds (tiền thu được) going to building a community garden.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "toàn bộ số tiền thu được dành để xây một khu vườn cộng đồng." },
  { text: "Many local artists", type: "np", grammarName: "Cụm danh từ", viTranslation: "Nhiều nghệ sĩ địa phương", breakLine: true },
  { text: "plan to donate", type: "vp", grammarName: "Cụm động từ", viTranslation: "dự định tặng" },
  { text: "pieces (tác phẩm)", type: "np", grammarName: "Cụm danh từ", viTranslation: "các tác phẩm" },
  { text: "for our auction,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cho buổi đấu giá của chúng ta," },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "as always,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "như mọi khi," },
  { text: "we", type: "np", grammarName: "Đại từ", viTranslation: "chúng tôi" },
  { text: "encourage", type: "vp", grammarName: "Cụm động từ", viTranslation: "khuyến khích" },
  { text: "all amateur (nghiệp dư) artists in our firm", type: "np", grammarName: "Cụm danh từ", viTranslation: "tất cả nghệ sĩ nghiệp dư trong công ty" },
  { text: "to donate", type: "vp", grammarName: "Cụm động từ", viTranslation: "tặng" },
  { text: "work", type: "np", grammarName: "Cụm danh từ", viTranslation: "tác phẩm" },
  { text: "as well (cũng).", type: "adjp", grammarName: "Trạng từ", viTranslation: "cũng như vậy." },
  { text: "Get out", type: "vp", grammarName: "Cụm động từ", viTranslation: "Hãy lấy ra", breakLine: true },
  { text: "those paintbrushes (cây cọ vẽ) and pencils", type: "np", grammarName: "Cụm danh từ", viTranslation: "những cây cọ vẽ và bút chì đó" },
  { text: "and", type: "other", grammarName: "Liên từ", viTranslation: "và" },
  { text: "unleash (giải phóng)", type: "vp", grammarName: "Cụm động từ", viTranslation: "giải phóng" },
  { text: "your creativity.", type: "np", grammarName: "Cụm danh từ", viTranslation: "sự sáng tạo của bạn." },
  { text: "It", type: "np", grammarName: "Đại từ", viTranslation: "Việc", breakLine: true },
  { text: "is always", type: "vp", grammarName: "Cụm động từ", viTranslation: "luôn là" },
  { text: "a treat (điều tuyệt vời)", type: "np", grammarName: "Cụm danh từ", viTranslation: "điều tuyệt vời" },
  { text: "to see", type: "vp", grammarName: "Cụm động từ", viTranslation: "được thấy" },
  { text: "our colleagues' art", type: "np", grammarName: "Cụm danh từ", viTranslation: "tác phẩm của đồng nghiệp" },
  { text: "hanging", type: "vp", grammarName: "Cụm động từ", viTranslation: "treo" },
  { text: "alongside pieces by professional artists!", type: "pp", grammarName: "Cụm giới từ", viTranslation: "cạnh các tác phẩm của nghệ sĩ chuyên nghiệp!" },
  { text: "This year's auction", type: "np", grammarName: "Cụm danh từ", viTranslation: "Buổi đấu giá năm nay", breakLine: true },
  { text: "will be", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ diễn ra" },
  { text: "at Seven Gates Hotel and Restaurant on Friday, July 27, at 7:00 PM.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "tại Khách sạn và Nhà hàng Seven Gates vào thứ Sáu, ngày 27 tháng 7, lúc 7 giờ tối." },
  { text: "Our event", type: "np", grammarName: "Cụm danh từ", viTranslation: "Sự kiện của chúng ta", breakLine: true },
  { text: "will be held", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ được tổ chức" },
  { text: "in the hotel restaurant,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trong nhà hàng của khách sạn," },
  { text: "which", type: "np", grammarName: "Đại từ", viTranslation: "nơi" },
  { text: "has", type: "vp", grammarName: "Cụm động từ", viTranslation: "có" },
  { text: "excellent lighting for our purposes.", type: "np", grammarName: "Cụm danh từ", viTranslation: "ánh sáng tuyệt vời cho mục đích của chúng ta." },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "have attached (đính kèm)", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã đính kèm" },
  { text: "a chart (biểu đồ)", type: "np", grammarName: "Cụm danh từ", viTranslation: "một biểu đồ" },
  { text: "listing", type: "vp", grammarName: "Cụm động từ", viTranslation: "liệt kê" },
  { text: "the professional art", type: "np", grammarName: "Cụm danh từ", viTranslation: "các tác phẩm chuyên nghiệp" },
  { text: "that", type: "np", grammarName: "Đại từ", viTranslation: "đã" },
  { text: "has been donated", type: "vp", grammarName: "Cụm động từ", viTranslation: "được tặng" },
  { text: "so far.", type: "adjp", grammarName: "Trạng từ", viTranslation: "cho đến nay." },
  { text: "If", type: "other", grammarName: "Liên từ", viTranslation: "Nếu", breakLine: true },
  { text: "you", type: "np", grammarName: "Đại từ", viTranslation: "bạn" },
  { text: "are interested in contributing", type: "vp", grammarName: "Cụm động từ", viTranslation: "quan tâm đóng góp" },
  { text: "this year,", type: "adjp", grammarName: "Trạng từ", viTranslation: "năm nay," },
  { text: "please e-mail", type: "vp", grammarName: "Cụm động từ", viTranslation: "vui lòng gửi e-mail" },
  { text: "me", type: "np", grammarName: "Đại từ", viTranslation: "cho tôi" },
  { text: "the details about your submission.", type: "np", grammarName: "Cụm danh từ", viTranslation: "chi tiết về tác phẩm bạn gửi." },
  { text: "Keep in mind", type: "vp", grammarName: "Cụm động từ", viTranslation: "Hãy nhớ", breakLine: true },
  { text: "that", type: "other", grammarName: "Liên từ", viTranslation: "rằng" },
  { text: "photographs, paintings, and drawings", type: "np", grammarName: "Cụm danh từ", viTranslation: "ảnh chụp, tranh vẽ và bản vẽ" },
  { text: "are", type: "vp", grammarName: "Cụm động từ", viTranslation: "là" },
  { text: "the most popular mediums (phương tiện).", type: "np", grammarName: "Cụm danh từ", viTranslation: "các phương tiện phổ biến nhất." },
  { text: "However,", type: "adjp", grammarName: "Trạng từ", viTranslation: "Tuy nhiên,", breakLine: true },
  { text: "one local artist", type: "np", grammarName: "Cụm danh từ", viTranslation: "một nghệ sĩ địa phương" },
  { text: "donated", type: "vp", grammarName: "Cụm động từ", viTranslation: "đã tặng" },
  { text: "a large sculpture (điêu khắc),", type: "np", grammarName: "Cụm danh từ", viTranslation: "một tác phẩm điêu khắc lớn," },
  { text: "which", type: "np", grammarName: "Đại từ", viTranslation: "tác phẩm này" },
  { text: "will be", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ là" },
  { text: "the auction's centerpiece (trung tâm).", type: "np", grammarName: "Cụm danh từ", viTranslation: "tâm điểm của buổi đấu giá." },
  { text: "Apart from that piece,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Ngoài tác phẩm đó,", breakLine: true },
  { text: "we", type: "np", grammarName: "Đại từ", viTranslation: "chúng tôi" },
  { text: "will only accept", type: "vp", grammarName: "Cụm động từ", viTranslation: "sẽ chỉ nhận" },
  { text: "sculptures under 50 centimeters tall.", type: "np", grammarName: "Cụm danh từ", viTranslation: "các tác phẩm điêu khắc cao dưới 50 cm." },
  { text: "Best regards,", type: "other", grammarName: "Thành phần khác", viTranslation: "Trân trọng,", breakLine: true },
  { text: "Miranda Noonan, Auction Chairperson", type: "np", grammarName: "Cụm danh từ", viTranslation: "Miranda Noonan, Chủ tịch ban tổ chức đấu giá", breakLine: true },
  { text: "Ogunsanya and Bolden Art Auction: Local Artist Donations", type: "np", grammarName: "Cụm danh từ", viTranslation: "Đấu giá nghệ thuật Ogunsanya and Bolden: Các tác phẩm do nghệ sĩ địa phương tặng", breakLine: true },
  { text: "Hello, Ms. Noonan,", type: "other", grammarName: "Thành phần khác", viTranslation: "Xin chào bà Noonan,", breakLine: true },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "am planning to contribute", type: "vp", grammarName: "Cụm động từ", viTranslation: "đang dự định đóng góp" },
  { text: "a piece of art", type: "np", grammarName: "Cụm danh từ", viTranslation: "một tác phẩm nghệ thuật" },
  { text: "again this year,", type: "adjp", grammarName: "Trạng từ", viTranslation: "năm nay nữa," },
  { text: "but", type: "other", grammarName: "Liên từ", viTranslation: "nhưng" },
  { text: "I've", type: "np", grammarName: "Đại từ", viTranslation: "tôi đã" },
  { text: "noticed", type: "vp", grammarName: "Cụm động từ", viTranslation: "nhận thấy" },
  { text: "its subject (chủ đề)", type: "np", grammarName: "Cụm danh từ", viTranslation: "chủ đề của nó" },
  { text: "is", type: "vp", grammarName: "Cụm động từ", viTranslation: "rất" },
  { text: "very similar to that of another piece listed in your e-mail attachment.", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "giống với chủ đề của một tác phẩm khác trong tệp đính kèm e-mail của bà." },
  { text: "I've", type: "np", grammarName: "Đại từ", viTranslation: "Tôi đã", breakLine: true },
  { text: "painted", type: "vp", grammarName: "Cụm động từ", viTranslation: "vẽ" },
  { text: "an orchard (vườn cây ăn quả)", type: "np", grammarName: "Cụm danh từ", viTranslation: "một vườn cây ăn quả" },
  { text: "near my parents' house", type: "pp", grammarName: "Cụm giới từ", viTranslation: "gần nhà bố mẹ tôi" },
  { text: "as", type: "other", grammarName: "Liên từ", viTranslation: "như" },
  { text: "it", type: "np", grammarName: "Đại từ", viTranslation: "nó" },
  { text: "looks", type: "vp", grammarName: "Cụm động từ", viTranslation: "trông" },
  { text: "just when the sun is rising above it.", type: "adjp", grammarName: "Trạng từ", viTranslation: "đúng lúc mặt trời mọc phía trên." },
  { text: "Could I ask", type: "vp", grammarName: "Cụm động từ", viTranslation: "Tôi có thể đề nghị", breakLine: true },
  { text: "that", type: "other", grammarName: "Liên từ", viTranslation: "rằng" },
  { text: "my painting", type: "np", grammarName: "Cụm danh từ", viTranslation: "bức tranh của tôi" },
  { text: "be placed", type: "vp", grammarName: "Cụm động từ", viTranslation: "được đặt" },
  { text: "away from the similar artwork?", type: "adjp", grammarName: "Trạng từ", viTranslation: "cách xa tác phẩm tương tự không?" },
  { text: "Thanks,", type: "other", grammarName: "Thành phần khác", viTranslation: "Cảm ơn,", breakLine: true },
  { text: "Omonuwa Orou", type: "np", grammarName: "Cụm danh từ", viTranslation: "Omonuwa Orou", breakLine: true },
  { text: "Questions 196-200", type: "np", grammarName: "Cụm danh từ", viTranslation: "Câu hỏi 196-200", breakLine: true },
  { text: "refer to", type: "vp", grammarName: "Cụm động từ", viTranslation: "tham khảo" },
  { text: "the following e-mails and sign.", type: "np", grammarName: "Cụm danh từ", viTranslation: "các e-mail và bảng hiệu sau đây" },
  { text: "Dear Ms. Maeda,", type: "np", grammarName: "Cụm danh từ", viTranslation: "Kính gửi bà Maeda,", breakLine: true },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "am writing", type: "vp", grammarName: "Cụm động từ", viTranslation: "viết thư" },
  { text: "regarding the open office manager position (job 3723) at Franta Exports here in my hometown (quê hương) of Liverpool.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "về vị trí quản lý văn phòng đang tuyển (công việc 3723) tại Franta Exports ở Liverpool, quê hương tôi." },
  { text: "With eight years of experience in office management and administration (hành chính),", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Với tám năm kinh nghiệm quản lý và hành chính văn phòng,", breakLine: true },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "tôi" },
  { text: "am confident", type: "vp", grammarName: "Cụm động từ", viTranslation: "tự tin" },
  { text: "that", type: "other", grammarName: "Liên từ", viTranslation: "rằng" },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "tôi" },
  { text: "have", type: "vp", grammarName: "Cụm động từ", viTranslation: "có" },
  { text: "the skills and expertise (chuyên môn)", type: "np", grammarName: "Cụm danh từ", viTranslation: "kỹ năng và chuyên môn" },
  { text: "required", type: "adjp", grammarName: "Cụm tính từ", viTranslation: "cần thiết" },
  { text: "to excel (vượt trội)", type: "vp", grammarName: "Cụm động từ", viTranslation: "để vượt trội" },
  { text: "in this role.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "trong vai trò này." },
  { text: "In my current position as office manager at Wyler International,", type: "pp", grammarName: "Cụm giới từ", viTranslation: "Ở vị trí hiện tại là quản lý văn phòng tại Wyler International,", breakLine: true },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "tôi" },
  { text: "am responsible", type: "vp", grammarName: "Cụm động từ", viTranslation: "chịu trách nhiệm" },
  { text: "for managing all aspects (khía cạnh) of office operations (quản lý),", type: "pp", grammarName: "Cụm giới từ", viTranslation: "quản lý mọi khía cạnh vận hành văn phòng," },
  { text: "including budgeting, scheduling, and staff management.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "bao gồm lập ngân sách, lên lịch và quản lý nhân viên." },
  { text: "My résumé", type: "np", grammarName: "Cụm danh từ", viTranslation: "Sơ yếu lý lịch của tôi", breakLine: true },
  { text: "is attached.", type: "vp", grammarName: "Cụm động từ", viTranslation: "được đính kèm." },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "am excited", type: "vp", grammarName: "Cụm động từ", viTranslation: "rất hào hứng" },
  { text: "about the possibility (khả năng) of bringing my skills and experience to Franta Exports.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "về khả năng mang kỹ năng và kinh nghiệm của mình đến Franta Exports." },
  { text: "I", type: "np", grammarName: "Đại từ", viTranslation: "Tôi", breakLine: true },
  { text: "look forward to hearing", type: "vp", grammarName: "Cụm động từ", viTranslation: "mong nhận được" },
  { text: "from you soon.", type: "pp", grammarName: "Cụm giới từ", viTranslation: "hồi âm của bà sớm." },

            renderParsedData(DEFAULT_PARSED_DATA);

function renderParsedData(parsedItems) {
    const container = document.getElementById('resultContent');
    container.innerHTML = '';

    document.getElementById('phraseCount').innerText = `${parsedItems.length} cụm từ`;

    parsedItems.forEach((item, index) => {
        // Nếu phần tử được đánh dấu breakLine hoặc là phần tử đầu tiên, tạo thẻ xuống dòng (div mới)
        if (item.breakLine || index === 0) {
            const lineBreak = document.createElement('div');
            // Tạo khoảng cách giữa các dòng cho thoáng mắt
            lineBreak.className = index === 0 ? 'w-full mb-2' : 'w-full mt-4 mb-2 pt-2';
            container.appendChild(lineBreak);
        }

        const tag = document.createElement('span');
        
        // Gán class phân loại màu sắc bình thường dựa vào type (np, vp, pp, adjp, other)
        tag.className = `phrase-tag phrase-${item.type}`;
        tag.setAttribute('data-type', item.type);
        tag.setAttribute('data-index', index);

        const formattedContent = formatBracketText(item.text);

        tag.innerHTML = `
            ${formattedContent}
            <span class="tooltip bg-slate-900 text-white text-xs px-3 py-1.5 rounded-lg shadow-xl font-normal border border-slate-700">
                <span class="text-orange-400 font-semibold">${item.viTranslation || item.text}</span>
                <span class="text-slate-400 block text-[10px] mt-0.5">${item.grammarName}</span>
            </span>
        `;

        tag.addEventListener('mouseenter', () => updateDetailCard(item));
        tag.addEventListener('click', () => updateDetailCard(item));

        container.appendChild(tag);
    });
}
        function updateDetailCard(item) {
            document.getElementById('cardTranslation').innerText = `"${item.text.trim()}" ➔ ${item.viTranslation || 'N/A'}`;
            document.getElementById('cardGrammarType').innerText = item.grammarName;
        }

        function formatBracketText(text) {
            return text.replace(/(\b[\w']+\b)\s*(\([\s\S]*?\))/g, '<b class="bold-before-bracket">$1</b><span class="bracket-note">$2</span>');
        }

        function filterType(type) {
            const tags = document.querySelectorAll('.phrase-tag');
            const buttons = document.querySelectorAll('.legend-btn');

            buttons.forEach(btn => btn.classList.remove('active', 'bg-slate-800', 'text-white'));
            event.currentTarget.classList.add('active', 'bg-slate-800', 'text-white');

            tags.forEach(tag => {
                if (type === 'all') {
                    tag.classList.remove('active-filter');
                    tag.style.opacity = '1';
                } else if (tag.getAttribute('data-type') === type) {
                    tag.classList.add('active-filter');
                    tag.style.opacity = '1';
                } else {
                    tag.classList.remove('active-filter');
                    tag.style.opacity = '0.25';
                }
            });
        }
    </script>
